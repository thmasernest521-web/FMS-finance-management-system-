
name: Build FMS Offline APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract FMS project
        run: |
          unzip -o FMS_Android_Project_4_0.zip -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project settings.gradle not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build FMS APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: FMS-Offline-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
